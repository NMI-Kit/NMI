<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدرّس الدوال الخطية - الصف العاشر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FDFEFF; --grid:#D3E2F2; --ink:#17233B; --red:#D4303B; --pencil:#2B5FA6; --soft:#EEF4FB;
  font-family:"Readex Pro","Segoe UI",Tahoma,Arial,sans-serif; color:var(--ink);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
body::before{content:"";position:fixed;top:0;bottom:0;right:44px;width:2px;background:var(--red);opacity:.7;pointer-events:none}
.app{max-width:720px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:0 16px 0 64px}
header{padding:18px 0 10px}
h1{font-size:1.25rem;line-height:1.5;margin:0;font-weight:600}
header p{margin:2px 0 0;font-size:.85rem;color:var(--pencil)}
#setup{margin:auto 0;background:var(--paper);border:2px solid var(--ink);padding:20px}
#setup label{display:block;margin:0 0 6px;font-size:.9rem}
#setup input,#setup select{width:100%;font:inherit;padding:10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);margin-bottom:16px;border-radius:0}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:0}
button.alt{background:var(--paper);color:var(--ink)}
button:disabled{opacity:.5;cursor:default}
#chat{display:none;flex:1;min-height:0;flex-direction:column}
#log{flex:1;overflow-y:auto;padding:6px 0 12px}
.msg{margin:0 0 12px;padding:10px 12px;max-width:92%;line-height:1.8;font-size:.95rem}
.msg div{white-space:pre-wrap;overflow-wrap:anywhere}
.me{background:var(--soft);border:2px solid var(--pencil);margin-inline-start:auto}
.ai{background:var(--paper);border:2px solid var(--ink);border-inline-start:6px solid var(--red)}
.err{background:var(--paper);border:2px dashed var(--red);color:var(--red)}
.wait{color:var(--pencil)}
#bar{padding:8px 0 12px;background:linear-gradient(transparent,var(--paper) 25%)}
#quick{display:flex;gap:8px;margin-bottom:8px}
#quick button{padding:6px 12px;font-size:.85rem}
#row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;font:inherit;padding:10px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);resize:none;max-height:120px;border-radius:0}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>مدرّس الدوال الخطية</h1>
    <p>الصف العاشر</p>
  </header>
  <section id="setup">
    <label for="name">اسمك</label>
    <input id="name" maxlength="20" autocomplete="given-name">
    <label for="track">مسار الرياضيات</label>
    <select id="track">
      <option value="3">3 وحدات</option>
      <option value="4">4 وحدات</option>
      <option value="5">5 وحدات</option>
    </select>
    <button id="start">ابدأ</button>
  </section>
  <section id="chat" aria-live="polite">
    <div id="log"></div>
    <div id="bar">
      <div id="quick"><button class="alt" id="testMe">اختبرني بمسألة</button></div>
      <div id="row">
        <textarea id="input" rows="1" placeholder="اكتب مسألتك أو جوابك"></textarea>
        <button id="send">أرسل</button>
      </div>
    </div>
  </section>
</div>
<script>
const WORKER_URL = "PUT_YOUR_WORKER_URL_HERE";
async function askAI(messages, profile) {
  const r = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages, track: profile.track, name: profile.name })
  });
  if (!r.ok) throw new Error("status_" + r.status);
  const data = await r.json();
  if (!data.reply) throw new Error("empty");
  return data.reply;
}
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), sendBtn = $("send");
let profile = { name: "", track: "3" };
let history = [];
let busy = false;
function addMsg(text, cls) {
  const m = document.createElement("div");
  m.className = "msg " + cls;
  text.split("\n").forEach(line => {
    const d = document.createElement("div");
    d.dir = "auto";
    d.textContent = line || "\u00A0";
    m.appendChild(d);
  });
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return m;
}
async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; $("testMe").disabled = true;
  addMsg(text, "me");
  history.push({ role: "user", content: text });
  if (history.length > 20) history = history.slice(-20);
  while (history.length && history[0].role !== "user") history.shift();
  input.value = ""; input.style.height = "auto";
  const wait = addMsg("المدرّس يفكر...", "ai wait");
  try {
    const reply = await askAI(history, profile);
    wait.remove();
    addMsg(reply, "ai");
    history.push({ role: "assistant", content: reply });
  } catch (e) {
    wait.remove();
    history.pop();
    const why = String(e.message).includes("status_403")
      ? "الموقع مش مصرّح له يتصل بالخادم."
      : "ما قدرت أوصل للمدرّس. جرب مرة ثانية.";
    addMsg(why, "err");
  }
  busy = false; sendBtn.disabled = false; $("testMe").disabled = false;
  input.focus();
}
$("start").onclick = () => {
  profile.name = $("name").value.trim();
  profile.track = $("track").value;
  $("setup").style.display = "none";
  $("chat").style.display = "flex";
  addMsg(`أهلاً ${profile.name || "يا بطل"}. اكتب مسألة من الدوال الخطية وبنحلها سوا، أو اضغط "اختبرني بمسألة".`, "ai");
};
$("testMe").onclick = () => send("اختبرني بمسألة وحدة من الدوال الخطية بمستوى مساري.");
sendBtn.onclick = () => send(input.value);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});
</script>
</body>
</html>
